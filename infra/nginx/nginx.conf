# Nginx load balancer in front of the ingestion APIs and the read APIs
# (prototype stand-in for the HAProxy pair).
worker_processes 1;
events { worker_connections 1024; }

http {
    # Rate limit per tablet (X-Device-Id header), falling back to the client address.
    map $http_x_device_id $limit_key {
        ""      $binary_remote_addr;
        default $http_x_device_id;
    }
    limit_req_zone $limit_key zone=per_device:10m rate=2r/s;
    # Readers are limited per user (X-User header).
    map $http_x_user $reader_key {
        ""      $binary_remote_addr;
        default $http_x_user;
    }
    limit_req_zone $reader_key zone=per_reader:1m rate=10r/s;
    limit_req_status 429;

    # Re-resolve container names every few seconds, so recreated API containers are found.
    resolver 127.0.0.11 valid=5s ipv6=off;      # Docker's internal DNS

    upstream ingest_api {
        zone ingest_api 64k;
        server ingest-api-1:8000 resolve max_fails=2 fail_timeout=5s;
        server ingest-api-2:8000 resolve max_fails=2 fail_timeout=5s;
    }

    upstream read_api {
        zone read_api 64k;
        server read-api-1:8000 resolve max_fails=2 fail_timeout=5s;
        server read-api-2:8000 resolve max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        client_max_body_size 2m;            # a 500-record batch is about 500 KB

        location /v1/ {
            limit_req zone=per_device burst=10 nodelay;
            proxy_pass http://ingest_api;
            proxy_set_header X-Device-Id $http_x_device_id;
            proxy_read_timeout 15s;
            # If one API copy is down, try the other. Safe for POST because every
            # record carries a record_id, so a repeated upload creates no duplicates.
            proxy_next_upstream error timeout http_502 non_idempotent;
            proxy_next_upstream_tries 2;
            error_page 429 = @too_busy;
        }

        # Read path: dashboards. Longer prefix, so it wins over /v1/ above.
        location /v1/coverage/ {
            limit_req zone=per_reader burst=20 nodelay;
            proxy_pass http://read_api;
            proxy_set_header X-User $http_x_user;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503;   # GET is safe to retry
            proxy_next_upstream_tries 2;
            error_page 429 = @too_busy;
        }

        location @too_busy {
            add_header Retry-After 30 always;
            default_type application/json;
            return 429 '{"status":"too_busy","reason":"load balancer rate limit","retry_after_s":30}';
        }

        location = /healthz { proxy_pass http://ingest_api/healthz; }
    }
}
