# Mosquitto MQTT broker for the fridge sensors (prototype stand-in for the 3 independent EMQX nodes).
# Prototype: plain MQTT on 1883 inside the Docker network, no passwords. The design uses
# TLS on 8883 with one certificate per sensor; that is added in the TLS step.
listener 1883
allow_anonymous true

# Keep sessions and queued QoS 1 messages on disk, so a broker restart loses nothing.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# If the bridges are down, hold up to 20,000 messages per session (about 2 hours of readings
# at prototype scale) instead of dropping them.
max_queued_messages 20000
max_inflight_messages 200

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false
