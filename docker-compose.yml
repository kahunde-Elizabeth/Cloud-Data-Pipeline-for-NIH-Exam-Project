# NIDH prototype - Milestone 3
# Single start command:   docker compose up -d --build
# Stop (keep data):        docker compose down
# Stop and wipe data:      docker compose down -v
#
# Services are grouped like the deployment diagram (M1-b):
#   zone-a / zone-b / zone-c = one fault domain each, edge = load balancer and tools.
# Built so far: step 1 (stream + ingestion), step 2 (CockroachDB + processor),
# step 3 (aggregator, cache, read API, Prometheus + Grafana), step 4 (fridge sensors),
# step 5 (SMS: fridge alerts and dose reminders), step 6 (load generator + reconcile, as tools).
# Later steps add fault scripts and TLS.
#
# PHONE_KEY encrypts caregiver phone numbers in the database. The default below is a
# development key for SYNTHETIC data only; set your own in .env (see .env.example).

x-phone-key: &phone-key ${PHONE_KEY:-4OGLIpXyfsAWFDbVv_1bgx2U7IMRlbrOfrnnVcBqqlY=}

x-redpanda-common: &redpanda-common
  image: redpandadata/redpanda:v24.3.1
  mem_limit: 448m
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-roach-common: &roach-common
  image: cockroachdb/cockroach:v24.3.0
  mem_limit: 512m
  restart: unless-stopped

x-processor-common: &processor-common
  build: ./processor
  mem_limit: 96m
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    topics-init: { condition: service_completed_successfully }
    db-init: { condition: service_completed_successfully }

x-aggregator-common: &aggregator-common
  build: ./aggregator
  mem_limit: 96m
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    db-init: { condition: service_completed_successfully }
    cache: { condition: service_started }

x-read-common: &read-common
  build: ./read_api
  mem_limit: 128m
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    db-init: { condition: service_completed_successfully }
    cache: { condition: service_started }

x-sensor-bridge-common: &sensor-bridge-common
  build: ./sensor_bridge
  mem_limit: 64m
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    topics-init: { condition: service_completed_successfully }
    mosquitto: { condition: service_started }

x-sensor-agg-common: &sensor-agg-common
  build: ./sensor_aggregator
  mem_limit: 96m
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    topics-init: { condition: service_completed_successfully }
    db-init: { condition: service_completed_successfully }

x-sms-sender-common: &sms-sender-common
  build: ./sms_sender
  mem_limit: 64m
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    topics-init: { condition: service_completed_successfully }
    db-init: { condition: service_completed_successfully }
    sms-gateway: { condition: service_started }

x-ingest-common: &ingest-common
  build: ./ingest_api
  mem_limit: 96m
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    topics-init:
      condition: service_completed_successfully

services:
  # ------------------------------------------------------------------ stream (3 brokers, RF 3)
  redpanda-0:
    <<: *redpanda-common
    container_name: redpanda-0
    labels: { nidh.zone: zone-a }
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --seeds redpanda-0:33145,redpanda-1:33145,redpanda-2:33145
      - --smp 1
      - --memory 320M
      - --reserve-memory 0M
      - --overprovisioned
      - --check=false
      - --default-log-level=warn
    ports: ["19092:19092"]
    volumes: ["redpanda-0:/var/lib/redpanda/data"]

  redpanda-1:
    <<: *redpanda-common
    container_name: redpanda-1
    labels: { nidh.zone: zone-b }
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda-1:9092,external://localhost:29092
      - --rpc-addr redpanda-1:33145
      - --advertise-rpc-addr redpanda-1:33145
      - --seeds redpanda-0:33145,redpanda-1:33145,redpanda-2:33145
      - --smp 1
      - --memory 320M
      - --reserve-memory 0M
      - --overprovisioned
      - --check=false
      - --default-log-level=warn
    ports: ["29092:29092"]
    volumes: ["redpanda-1:/var/lib/redpanda/data"]

  redpanda-2:
    <<: *redpanda-common
    container_name: redpanda-2
    labels: { nidh.zone: zone-c }
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:39092
      - --advertise-kafka-addr internal://redpanda-2:9092,external://localhost:39092
      - --rpc-addr redpanda-2:33145
      - --advertise-rpc-addr redpanda-2:33145
      - --seeds redpanda-0:33145,redpanda-1:33145,redpanda-2:33145
      - --smp 1
      - --memory 320M
      - --reserve-memory 0M
      - --overprovisioned
      - --check=false
      - --default-log-level=warn
    ports: ["39092:39092"]
    volumes: ["redpanda-2:/var/lib/redpanda/data"]

  # Creates the topics once all three brokers are healthy, then exits.
  topics-init:
    image: redpandadata/redpanda:v24.3.1
    labels: { nidh.zone: edge }
    depends_on:
      redpanda-0: { condition: service_healthy }
      redpanda-1: { condition: service_healthy }
      redpanda-2: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        B="-X brokers=redpanda-0:9092,redpanda-1:9092,redpanda-2:9092"
        create() { rpk topic describe "$$1" $$B >/dev/null 2>&1 && echo "exists: $$1" || rpk topic create "$$@" $$B; }
        create vaccinations    -p 6 -r 3 -c retention.ms=604800000
        create sensor-readings -p 3 -r 3 -c retention.ms=604800000
        create rejects         -p 3 -r 3 -c retention.ms=2592000000
        create dlq             -p 1 -r 3 -c retention.ms=2592000000
        create alerts          -p 3 -r 3 -c retention.ms=2592000000
        rpk topic list $$B

  # Web UI to watch messages arrive (useful for the demo video). http://localhost:8088
  # Optional (not started by default, to save memory):
  #   docker compose --profile tools up -d console
  console:
    image: redpandadata/console:v2.8.0
    profiles: [tools]
    labels: { nidh.zone: edge }
    mem_limit: 192m
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda-0:9092,redpanda-1:9092,redpanda-2:9092
    ports: ["8088:8080"]
    depends_on:
      topics-init: { condition: service_completed_successfully }

  # ------------------------------------------------------------------ ingestion API (2 copies)
  ingest-api-1:
    <<: *ingest-common
    container_name: ingest-api-1
    labels: { nidh.zone: zone-a }
    environment: { INSTANCE_NAME: ingest-api-1 }

  ingest-api-2:
    <<: *ingest-common
    container_name: ingest-api-2
    labels: { nidh.zone: zone-b }
    environment: { INSTANCE_NAME: ingest-api-2 }

  # ------------------------------------------------------------------ database (3 nodes, RF 3)
  roach-0:
    <<: *roach-common
    container_name: roach-0
    hostname: roach-0
    labels: { nidh.zone: zone-a }
    command: [start, --insecure, "--join=roach-0:26257,roach-1:26257,roach-2:26257",
              --listen-addr=0.0.0.0:26257, --advertise-addr=roach-0:26257, --http-addr=0.0.0.0:8080,
              --cache=64MiB, --max-sql-memory=96MiB, --locality=zone=zone-a]
    ports: ["26257:26257", "8089:8080"]      # SQL, and the admin web page at http://localhost:8089
    volumes: ["roach-0:/cockroach/cockroach-data"]

  roach-1:
    <<: *roach-common
    container_name: roach-1
    hostname: roach-1
    labels: { nidh.zone: zone-b }
    command: [start, --insecure, "--join=roach-0:26257,roach-1:26257,roach-2:26257",
              --listen-addr=0.0.0.0:26257, --advertise-addr=roach-1:26257, --http-addr=0.0.0.0:8080,
              --cache=64MiB, --max-sql-memory=96MiB, --locality=zone=zone-b]
    volumes: ["roach-1:/cockroach/cockroach-data"]

  roach-2:
    <<: *roach-common
    container_name: roach-2
    hostname: roach-2
    labels: { nidh.zone: zone-c }
    command: [start, --insecure, "--join=roach-0:26257,roach-1:26257,roach-2:26257",
              --listen-addr=0.0.0.0:26257, --advertise-addr=roach-2:26257, --http-addr=0.0.0.0:8080,
              --cache=64MiB, --max-sql-memory=96MiB, --locality=zone=zone-c]
    volumes: ["roach-2:/cockroach/cockroach-data"]

  # Joins the three nodes into one cluster (first run only), then loads the schema and seed data.
  db-init:
    image: cockroachdb/cockroach:v24.3.0
    labels: { nidh.zone: edge }
    depends_on: [roach-0, roach-1, roach-2]
    environment:
      COCKROACH_LICENSE: ${COCKROACH_LICENSE:-}
    volumes: ["./db:/db:ro"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        H="--insecure --host=roach-0:26257"
        until out=$$(cockroach init $$H 2>&1) || echo "$$out" | grep -q "already been initialized"; do
          echo "waiting for the three nodes ..."; sleep 3
        done
        until cockroach sql $$H -e "SELECT 1" >/dev/null 2>&1; do sleep 2; done
        if [ -n "$$COCKROACH_LICENSE" ]; then
          cockroach sql $$H -e "SET CLUSTER SETTING enterprise.license = '$$COCKROACH_LICENSE';"
        fi
        set -e
        # CockroachDB normally records its own metrics into its own tables. That kept each node
        # near 100% CPU on the test laptop; Prometheus collects the same numbers, so turn it off.
        cockroach sql $$H -e "SET CLUSTER SETTING timeseries.storage.enabled = false;"
        cockroach sql $$H -f /db/schema.sql
        cockroach sql $$H -f /db/seed.sql
        cockroach sql $$H -d nidh -e "SELECT count(*) AS facilities FROM facilities;"

  # ------------------------------------------------------------------ processor (2 copies, one consumer group)
  processor-1:
    <<: *processor-common
    container_name: processor-1
    labels: { nidh.zone: zone-a }
    environment: { INSTANCE_NAME: processor-1, PHONE_KEY: *phone-key }

  processor-2:
    <<: *processor-common
    container_name: processor-2
    labels: { nidh.zone: zone-b }
    environment: { INSTANCE_NAME: processor-2, PHONE_KEY: *phone-key }

  # ------------------------------------------------------------------ read path (step 3)
  # Cache for dashboard answers. Valkey is the open-source (BSD) fork of Redis and speaks the
  # same protocol; Redis 8 itself is AGPL. Memory-only: losing it loses nothing, the
  # aggregator refills it within 15 s.
  cache:
    image: valkey/valkey:8.0-alpine
    container_name: cache
    labels: { nidh.zone: zone-c }
    mem_limit: 48m
    restart: unless-stopped
    command: [valkey-server, --maxmemory, 32mb, --maxmemory-policy, allkeys-lru,
              --save, "", --appendonly, "no"]

  # Two copies; only the one holding the lease in aggregator_lease writes.
  aggregator-1:
    <<: *aggregator-common
    container_name: aggregator-1
    labels: { nidh.zone: zone-a }
    environment: { INSTANCE_NAME: aggregator-1 }

  aggregator-2:
    <<: *aggregator-common
    container_name: aggregator-2
    labels: { nidh.zone: zone-b }
    environment: { INSTANCE_NAME: aggregator-2 }

  read-api-1:
    <<: *read-common
    container_name: read-api-1
    labels: { nidh.zone: zone-a }
    environment: { INSTANCE_NAME: read-api-1 }

  read-api-2:
    <<: *read-common
    container_name: read-api-2
    labels: { nidh.zone: zone-b }
    environment: { INSTANCE_NAME: read-api-2 }

  # ------------------------------------------------------------------ fridge sensors (step 4)
  # MQTT broker. The design has 3 independent EMQX nodes; the prototype uses one Mosquitto.
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    labels: { nidh.zone: zone-c }
    mem_limit: 32m
    restart: unless-stopped
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto:/mosquitto/data

  # MQTT -> Redpanda. Two copies share one subscription; a message is acknowledged to the
  # broker only after Redpanda has confirmed it.
  sensor-bridge-1:
    <<: *sensor-bridge-common
    container_name: sensor-bridge-1
    labels: { nidh.zone: zone-a }
    environment: { INSTANCE_NAME: sensor-bridge-1 }

  sensor-bridge-2:
    <<: *sensor-bridge-common
    container_name: sensor-bridge-2
    labels: { nidh.zone: zone-b }
    environment: { INSTANCE_NAME: sensor-bridge-2 }

  # 1-minute windows, 2-8 C alerts, Last Will and 5-minute silence check, alert outbox.
  sensor-agg-1:
    <<: *sensor-agg-common
    container_name: sensor-agg-1
    labels: { nidh.zone: zone-a }
    environment: { INSTANCE_NAME: sensor-agg-1 }

  sensor-agg-2:
    <<: *sensor-agg-common
    container_name: sensor-agg-2
    labels: { nidh.zone: zone-b }
    environment: { INSTANCE_NAME: sensor-agg-2 }

  # 160 synthetic fridge sensors (3,200 facilities / k 20), one reading a minute each.
  # Fault control page: http://localhost:8091 (see scripts/fridge_fault.py)
  sensor-sim:
    build: ./sensor_sim
    container_name: sensor-sim
    labels: { nidh.zone: edge }
    mem_limit: 96m
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports: ["8091:8091"]
    depends_on: [mosquitto, sensor-bridge-1, sensor-bridge-2]

  # ------------------------------------------------------------------ SMS (step 5)
  # Mock SMS provider: sometimes slow, sometimes fails, UGX 30 a message, never sends anything.
  # Control and inspection: http://localhost:8092/sent , /outage?seconds=120
  sms-gateway:
    build: ./sms_gateway
    container_name: sms-gateway
    labels: { nidh.zone: edge }
    mem_limit: 32m
    restart: unless-stopped
    ports: ["8092:8092"]
    volumes: ["sms-data:/data"]

  # Two copies read the alerts topic; the lease holder runs the reminder job and sends.
  sms-sender-1:
    <<: *sms-sender-common
    container_name: sms-sender-1
    labels: { nidh.zone: zone-a }
    environment: { INSTANCE_NAME: sms-sender-1, PHONE_KEY: *phone-key }

  sms-sender-2:
    <<: *sms-sender-common
    container_name: sms-sender-2
    labels: { nidh.zone: zone-b }
    environment: { INSTANCE_NAME: sms-sender-2, PHONE_KEY: *phone-key }

  # ------------------------------------------------------------------ test tools (step 6)
  # Not started by `up`. Run on demand, results go to ./results/<run_id>/:
  #   docker compose run --rm generator e1 --run-id e1-run1
  #   docker compose run --rm reconcile e1-run1
  generator:
    build: ./generator
    image: nidh-generator
    profiles: [tools]
    labels: { nidh.zone: edge }
    mem_limit: 160m
    environment: { SCALE_K: "20", GENERATOR_URL: "http://nginx:80", RESULTS_DIR: /results }
    volumes: ["./results:/results"]

  reconcile:
    build: ./generator
    image: nidh-generator
    profiles: [tools]
    labels: { nidh.zone: edge }
    mem_limit: 160m
    entrypoint: ["python", "-m", "app.reconcile"]
    env_file:
      - path: .env
        required: false
    environment: { RESULTS_DIR: /results, PROMETHEUS_URL: "http://prometheus:9090" }
    volumes: ["./results:/results"]

  # ------------------------------------------------------------------ monitoring (step 3)
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: prometheus
    labels: { nidh.zone: edge }
    mem_limit: 192m
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=3d,
              --storage.tsdb.path=/prometheus]
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: grafana
    labels: { nidh.zone: edge }
    mem_limit: 160m
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"            # prototype: view without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nidh.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports: ["3000:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on: [prometheus]

  # ------------------------------------------------------------------ load balancer
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    labels: { nidh.zone: edge }
    mem_limit: 64m
    restart: unless-stopped
    ports: ["8080:80"]
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [ingest-api-1, ingest-api-2, read-api-1, read-api-2]

volumes:
  redpanda-0:
  redpanda-1:
  redpanda-2:
  roach-0:
  roach-1:
  roach-2:
  prometheus:
  grafana:
  mosquitto:
  sms-data:
